spring.application.name=demoapplication

# H2 Database config (in-memory)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Recommended for dev, update schema automatically
spring.jpa.hibernate.ddl-auto=update

# Flyway config
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Google OAuth2 client config (use environment variables or placeholders)
# spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
# spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

# Use default Spring redirect URI placeholder, replace {registrationId} dynamically
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/{registrationId}

spring.security.oauth2.client.registration.google.scope=openid,email,profile

# Optional: frontend redirect URL after login
app.oauth2.redirect-uri=http://localhost:3000/oauth2/redirect

# JWT secret (use environment variable)
# jwt.secret=${JWT_SECRET}
# jwt.expiration=36000000

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
